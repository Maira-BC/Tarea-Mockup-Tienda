<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baño Silvestre - Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="pago-pag">
    <main class="pago-contenedor">
        <section class="detalle-compra">
            <h2>DETALLE</h2>
            <div class="resumen">
                <p>1 SHAMPOO <span>$14.990</span></p>
                <p>2 CREMA <span>$23.980</span></p>
                <p>2 ACEITE <span>$29.980</span></p>
                <p>4 JABÓN <span>$39.960</span></p>
            </div>
            <p class="total">
                TOTAL <span>$108.910</span>
            </p>
            <h2>MÉTODO DE PAGO</h2>
            <button>WEB PAY/TRANSBANK</button>
            <button>MERCADO PAGO</button>
            <p class="entrega">
                ENTREGA ESTIMADA:<br>
                22-23 DE AGOSTO
            </p>
            <button class="boton-comprar">COMPRAR</button>
        </section>
        <section class="imagen-compra">
            <img src="compra.png" alt="">
        </section>
        <section class="datos-envio">
            <h2>DATOS PERSONALES</h2>
            <p>
                NOMBRE: JOSE MIGUEL<br>
                CORREO: JOSEMIGUEL@GMAIL.COM
            </p>
            <label for="direccion">DIRECCIÓN DE ENTREGA</label>
            <input type="text" id="direccion" value="CALLE 123 CASA 45">
            <label for="comuna">COMUNA</label>
            <input type="text" id="comuna" value="VIÑA DEL MAR">
            <label for="detalles">DETALLES EXTRAS (OPCIONAL)</label>
            <textarea id="detalles">DEJAR EN CONSERJERÍA A NOMBRE DE ...</textarea>
        </section>
    </main>
</body>
</html>
